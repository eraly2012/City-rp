name: Build City RP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build folder
        run: mkdir -p build

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/CityRP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: City-RP-APK
          path: build/CityRP.apk
